# DevForge API — Render blueprint.
# Deploys the Express/Prisma backend as a web service. SQLite data lives on a
# persistent disk at /data (survives restarts; cleared only on delete/recreate).
# The static client deploys separately to Netlify (see netlify.toml).
#
# After "New Web Service" from this blueprint, note the actual Render URL
# (usually https://devforge-api.onrender.com, appended with a suffix if taken).
# If it differs, update API_URL / *_REDIRECT_URI in Render, VITE_API_URL on
# Netlify, and the authorized redirect URIs in the Google/GitHub consoles.
services:
  - type: web
    name: devforge-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:/data/devforge.db
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DEMO_MODE
        value: "false"
      - key: CLIENT_ORIGIN
        value: https://devforge-df.netlify.app
      - key: API_URL
        value: https://devforge-api.onrender.com
      # GitHub OAuth (optional): register an app and set these.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://devforge-api.onrender.com/api/github/callback
      - key: GITHUB_APP_ORIGIN
        value: https://devforge-df.netlify.app
      # Google OAuth (optional): register a Google OAuth client and set these.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://devforge-api.onrender.com/api/auth/google/callback
      - key: GOOGLE_APP_ORIGIN
        value: https://devforge-df.netlify.app
      # AI: leave AI_PROVIDER empty to use the built-in demo engine, or set
      # AI_PROVIDER=openai-aicompat with OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL.
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    # NODE_ENV=production makes npm skip devDependencies, which the build (tsc,
    # vite) and the seed (tsx) need — so install dev deps explicitly.
    buildCommand: npm install --include=dev && npm --prefix server install --include=dev && npm run build:server
    # Seed the (initially empty) SQLite DB so demo@devforge.dev / devforge123 works.
    preDeployCommand: npm --prefix server exec prisma db push && npm --prefix server exec prisma db seed
    startCommand: npm start
    disk:
      name: devforge-data
      mountPath: /data
      sizeGB: 1